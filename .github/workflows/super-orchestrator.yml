name: Super Orchestrator (Coleta + IA)

on:
  repository_dispatch:
    types: [run-super-orchestrator]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Otimização: Baixa apenas o último commit

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Adicionar pnpm ao PATH
        run: echo "PNPM_HOME=$HOME/.local/share/pnpm" >> $GITHUB_ENV && echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline # Otimização: Prioriza cache local

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Run Super Orchestrator
        env:
          POLITICIAN_NAME: ${{ github.event.client_payload.politicianName }}
          ANALYSIS_ID: ${{ github.event.client_payload.analysisId }}
          POLITICIAN_STATE: ${{ github.event.client_payload.state }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CUSTOM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: npx tsx server/scripts/super-orchestrator.ts
