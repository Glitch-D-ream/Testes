name: 🧠 Dual-Chain AI Worker (DeepSeek & Qwen)

on:
  repository_dispatch:
    types: [start-dual-chain-analysis]
  workflow_dispatch:
    inputs:
      analysis_id:
        description: 'ID da análise no Supabase'
        required: true

jobs:
  process-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: 🛠️ Adicionar pnpm ao PATH
        run: echo "PNPM_HOME=$HOME/.local/share/pnpm" >> $GITHUB_ENV && echo "$HOME/.local/share/pnpm" >> $GITHUB_PATH

      - name: 🛠️ Install Dependencies
        run: pnpm install --prefer-offline --no-frozen-lockfile

      - name: 🧠 Run Dual-Chain Analysis
        run: npx tsx server/scripts/dual-chain-worker.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANALYSIS_ID: ${{ github.event.client_payload.analysis_id || github.event.inputs.analysis_id }}
          ANALYSIS_CONTEXT: ${{ toJson(github.event.client_payload.context) }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_CUSTOM }}
          # Adicionando chaves de API para o Resilience Nexus funcionar
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
