name: Scout Orchestrator (Parallel Mining)

on:
  repository_dispatch:
    types: [run-scout-orchestrator]

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scout Orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLITICIAN_NAME: ${{ github.event.client_payload.politicianName }}
          ANALYSIS_ID: ${{ github.event.client_payload.analysisId }}
          POLITICIAN_STATE: ${{ github.event.client_payload.state }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx ts-node server/scripts/scout-orchestrator.ts
          npx ts-node server/scripts/finalize-scout-analysis.ts
